# Publishes to npm via Trusted Publishing (OIDC). No NPM_TOKEN.
# Configure the matching Trusted Publisher on npmjs.com before the first tag.
# First successful publish must happen within 2 days of creating that trust entry.
#
# Release process (main = published on npm, dev = development):
# 1. On dev, bump package.json + package-lock.json (next after registry, e.g. 0.0.58)
# 2. Merge dev → main
# 3. From that commit on main: git tag vX.Y.Z && git push origin vX.Y.Z
name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Never publish from forks or renamed mirrors.
    if: github.repository == 'adventureland-community/typed-adventureland'
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node 24 ships npm >= 11.5.1 (required for OIDC trusted publishing).
          node-version: "24"
          # Do not set registry-url: setup-node writes an empty _authToken line that
          # can prevent npm from using OIDC (ENEEDAUTH). Registry comes from
          # package.json publishConfig.
          package-manager-cache: false

      - name: Check Node and npm versions
        run: |
          node -e "const [maj,min]=process.versions.node.split('.').map(Number); if (maj<22 || (maj===22 && min<14)) { console.error('Need Node >= 22.14'); process.exit(1) }"
          node -e "const {execSync}=require('node:child_process'); const v=execSync('npm -v',{encoding:'utf8'}).trim(); const [maj,min,pat]=v.split('.').map(Number); if (maj<11 || (maj===11 && min<5) || (maj===11 && min===5 && pat<1)) { console.error('Need npm >= 11.5.1, got', v); process.exit(1) }"

      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag version '$TAG' does not match package.json version '$PKG'."
            echo "Bump package.json (and package-lock.json), commit, then tag v\$PKG."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

      - name: Publish to npm
        # Provenance is automatic with trusted publishing. No NPM_TOKEN.
        run: npm publish
